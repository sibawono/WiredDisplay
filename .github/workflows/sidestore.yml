name: SideStore Connect

# Each published (non-pre-release) GitHub release adds its IPA to the
# WiredDisplay source on SideStore Connect. The IPA stays on GitHub.
# Setup and manual runs: docs/SIDESTORE.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to send, e.g. v0.5.2'
        required: true

permissions:
  contents: read

concurrency:
  group: sidestore
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Send the release to SideStore Connect
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SIDESTORE_ACCESS_TOKEN: ${{ secrets.SIDESTORE_ACCESS_TOKEN }}
          SIDESTORE_BUNDLE_ID: ${{ vars.SIDESTORE_BUNDLE_ID }}
          SIDESTORE_LANG: ${{ vars.SIDESTORE_LANG }}
          SIDESTORE_PUBLISH: ${{ vars.SIDESTORE_PUBLISH }}
        run: |
          if [ -z "$SIDESTORE_ACCESS_TOKEN" ]; then
            echo "::warning::SIDESTORE_ACCESS_TOKEN is not set; nothing sent to SideStore Connect (see docs/SIDESTORE.md)"
            exit 0
          fi
          scripts/sidestore-publish.sh "$TAG"
